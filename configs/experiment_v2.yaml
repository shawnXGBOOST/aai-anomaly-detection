# Second run, after diagnosing the false alarms of the first (see docs/diagnosis.md).
# Decided from the *train* data and the literature, not tuned on test labels.
seed: 0
fit_fraction: 0.7
quantile: 0.995
hold: 20
adaptive: {rule: robust, window: 1000, max_freeze: 200}
models: [robust_z, isolation_forest, autoencoder]
thresholds: [fixed, adaptive_none, adaptive_freeze]
sensitivity: {quantiles: [0.99, 0.995, 0.999], holds: [0, 20, 50]}
profiling_channels: 5
drop_constant: true          # fix 1: ignore features that are constant in the fit data
min_thresholds: {robust_z: 3.5}   # fix 2: usual robust z-score cutoff (Iglewicz-Hoaglin)
abstain_constant_train: false     # fix 3 is run separately as v3
