[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aai"
version = "0.1.0"
description = "Adaptive Anomaly Intelligence: anomaly detection on NASA SMAP/MSL spacecraft telemetry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
api = ["fastapi>=0.110", "pydantic>=2.6", "uvicorn>=0.27", "httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
aai = "aai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
